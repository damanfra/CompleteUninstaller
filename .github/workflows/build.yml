name: Build

on:
  push:
    branches: [main, linux]
    tags: ['v*']
  pull_request:
  # "Run workflow" na aba Actions. Com uma versão (ex.: 0.1.3), cria a tag v0.1.3 e publica a release
  # a partir do commit da branch escolhida: serve para lançar sem precisar de git na máquina.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para publicar como release (ex.: 0.1.3). Vazio = só compilar.'
        required: false
        default: ''

jobs:
  windows:
    name: Windows (WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A versão do executável vem da tag (v1.2.3 -> 1.2.3). Sem tag, é 0.0.0-dev: o auto-update
      # considera qualquer release publicada mais nova que um build de desenvolvimento.
      - name: Definir a versão
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Versão inválida: '$INPUT_VERSION'. Use o formato 1.2.3, sem o v."; exit 1; fi
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Compilar e testar
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build

      - name: Publicar CompleteUninstaller.exe
        run: >
          dotnet publish src/CompleteUninstaller.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}
          -o out/windows

      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path out/windows/CompleteUninstaller.exe -DestinationPath CompleteUninstaller-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CompleteUninstaller-win-x64
          path: CompleteUninstaller-win-x64.zip

  linux:
    name: Linux (Avalonia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Definir a versão
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Versão inválida: '$INPUT_VERSION'. Use o formato 1.2.3, sem o v."; exit 1; fi
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      # Os testes dos parsers e das regras de segurança rodam aqui num Linux de verdade.
      - name: Compilar e testar
        run: |
          dotnet build CompleteUninstaller.Linux.slnf -c Release
          dotnet test CompleteUninstaller.Linux.slnf -c Release --no-build

      - name: Publicar o executável
        run: >
          dotnet publish src/CompleteUninstaller.App.Avalonia -c Release -r linux-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}
          -o out/linux

      - name: Empacotar
        run: |
          chmod +x out/linux/complete-uninstaller
          tar -czf CompleteUninstaller-linux-x64.tar.gz -C out/linux complete-uninstaller

      - uses: actions/upload-artifact@v4
        with:
          name: CompleteUninstaller-linux-x64
          path: CompleteUninstaller-linux-x64.tar.gz

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # O auto-update só instala um arquivo se o SHA-256 dele conferir com este.
      - name: Gerar o SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum CompleteUninstaller-win-x64.zip CompleteUninstaller-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Criar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pelo "Run workflow" a tag ainda não existe: o gh a cria no commit deste build (--target).
          TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          FROM_INPUT: ${{ inputs.version != '' }}
        run: |
          # Pelo "Run workflow", recusa versão já usada (a tag apontaria para outro commit).
          if [[ "$FROM_INPUT" == "true" ]] && gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::A tag $TAG já existe. Escolha outra versão."; exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
